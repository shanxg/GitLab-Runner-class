# ======================================================================
# Exercício 01 - Pipeline básico
# Arquivo: exercicios/01-pipeline-basico.yml
# Runner: Windows, executor shell; cada linha de script é PowerShell 5.1
# ======================================================================

# Etapas do pipeline, na ordem em que rodam.
# Uma etapa só começa quando todos os jobs da anterior passaram.
stages:
  - build              # 1ª etapa: compila a aplicação
  - test               # 2ª etapa: roda só se o build passou
  - deploy             # 3ª etapa: roda só se os dois testes passaram

# Configuração que TODOS os jobs deste arquivo herdam.
default:
  tags:                # tags escolhem qual runner pega o job...
    - windows-local    # ...e só o seu runner tem esta tag

# ----------------------------------------------------------------------
# Etapa build
# ----------------------------------------------------------------------
compilar:              # nome do job (livre); é o nome que aparece no GitLab
  stage: build         # em qual etapa o job roda
  script:              # comandos do job, executados em ordem
    - node --version   # mostra a versão do Node no log do job
    - npm run build    # roda o script "build" do package.json (gera dist\)

# ----------------------------------------------------------------------
# Etapa test: dois jobs na MESMA etapa
# ----------------------------------------------------------------------
testar:                # 1º job da etapa test
  stage: test          # mesma etapa do job de baixo = mesma coluna no pipeline
  script:
    - npm test         # roda os 4 testes; se um falhar, o job falha

verificar-sintaxe:     # 2º job da etapa test
  stage: test          # mesma etapa do job de cima
  script:
    - node --check src\server.js   # confere a sintaxe do arquivo sem executá-lo

# ----------------------------------------------------------------------
# Etapa deploy
# ----------------------------------------------------------------------
implantar:             # job de deploy (neste exercício, só imprime uma mensagem)
  stage: deploy        # última etapa
  environment:         # declara que este job faz deploy num ambiente
    name: production   # nome do ambiente; aparece em Operate > Environments
  script:
    - Write-Host "Implantando no ambiente $env:CI_ENVIRONMENT_NAME"   # o GitLab preenche com "production"