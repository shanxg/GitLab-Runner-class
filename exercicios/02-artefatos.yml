stages:
  - build              # 1ª etapa: compila a aplicação
  - test               # 2ª etapa: roda só se o build passou

# Configuração que TODOS os jobs deste arquivo herdam.
default:
  tags:                # tags escolhem qual runner pega o job...
    - windows-local    # ...e só o seu runner tem esta tag

# ----------------------------------------------------------------------
# Etapa build
# ----------------------------------------------------------------------
compilar:              # nome do job (livre); é o nome que aparece no GitLab
  stage: build         # em qual etapa o job roda
  script:              # comandos do job, executados em ordem
    - npm run build    # roda o script "build" do package.json (gera dist\)
    - Set-Content -Path dist\build-info.txt -Value "Build $env:CI_PIPELINE_ID com o commit'$env:CI_COMMIT_SHORT_SHA' concluído em $((Get-Date).ToString('yyyy-MM-dd HH:mm:ss'))"   # cria um arquivo de build info
  artifacts:             # declara que o job gera artefatos (arquivos) para os próximos jobs
    paths:
      - dist\build-info.txt   # o job de teste vai pegar este arquivo
    expire_in: 1 day         # artefato expira em 1 hora; depois disso, não dá mais para baixar

# ----------------------------------------------------------------------
# Etapa test: dois jobs na MESMA etapa
# ----------------------------------------------------------------------
testar-dist:                          # nome do job (livre)
  stage: test                         # roda depois da etapa build
  script:
    - Get-ChildItem dist              # lista a pasta dist, que chegou pelo artefato
    - Get-Content dist\build-info.txt # mostra o conteúdo do build-info.txt
    - node --check dist\server.js     # confere a sintaxe do arquivo sem executá-lo

