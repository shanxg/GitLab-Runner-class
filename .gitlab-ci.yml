default:
  tags:
    - windows-local
  retry:
   max: 2
   when:
    - runner_system_failure
    - stuck_or_timeout_failure
    - scheduler_failure

stages:
 - package
 - deploy

variables:
  IMAGE_TAG: $env:CI_REGISTRY_IMAGE:$env:CI_COMMIT_SHORT_SHA

package:
  stage: package
  script:
    - $env:CI_REGISTRY_PASSWORD | docker login -u $env:CI_REGISTRY_USER --password-stdin $env:CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker push $env:IMAGE_TAG

deploy:
  stage: deploy
  script:
    - $env:CI_REGISTRY_PASSWORD | docker login -u $env:CI_REGISTRY_USER --password-stdin $env:CI_REGISTRY
    - docker pull $env:IMAGE_TAG
    - if (docker ps -a -q --filter "name=$env:^estudos-app$") { docker rm -f estudos-app }
    - docker run -d --name estudos-app -p 7800:81 -e APP_VERSION=$env:CI_COMMIT_SHORT_SHA $env:IMAGE_TAG
