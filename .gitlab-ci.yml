default:
  tags:
    - windows-local
  retry:
   max: 2
   when:
    - runner_system_failure
    - stuck_or_timeout_failure
    - scheduler_failure

stages:
 - test
 - package
 - deploy

#variables:
#  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA


# --- Etapa 1: Testes (trazidos do Exercício 01) ---
test:
  stage: test
  script:
    - npm test

verificar-sintaxe:
  stage: test
  script:
    - node --check src\server.js


# --- Etapa 2: Empacotamento Docker ---
package:
  stage: package
  script:
    - $IMAGE = "${env:CI_REGISTRY_IMAGE}:${env:CI_COMMIT_SHORT_SHA}"
    - $env:CI_REGISTRY_PASSWORD | docker login -u $env:CI_REGISTRY_USER --password-stdin $env:CI_REGISTRY
    - docker build -t $IMAGE .
    - docker push $IMAGE


# --- Etapa 3: Deploy (somente na branch main) ---
deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - $IMAGE = "${env:CI_REGISTRY_IMAGE}:${env:CI_COMMIT_SHORT_SHA}"
    - $env:CI_REGISTRY_PASSWORD | docker login -u $env:CI_REGISTRY_USER --password-stdin $env:CI_REGISTRY
    - docker pull $IMAGE
    - if (docker ps -a -q --filter "name=estudos-app") { docker rm -f estudos-app }
    - docker run -d --name estudos-app -p 7800:81 -e APP_VERSION=$env:CI_COMMIT_SHORT_SHA $IMAGE
